backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - file: "content/homepage.md"
        label: "Homepage Content"
        name: "homepage"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "intro", label: "Intro", widget: "text" }
          - { name: "about", label: "About", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Project Title", widget: "string" }
      - { name: "status", label: "Status", widget: "string" }
      - { name: "about", label: "About", widget: "text" }
      - { name: "items", label: "Items", widget: "list" }
      - { name: "build_log", label: "Build Log", widget: "markdown" }
      - { name: "photos", label: "Photos", widget: "image" }
